buildscript {
	ext {
		springBootVersion = '2.1.6.RELEASE'
		snippetsDir = file('build/generated-snippets')
	}
	repositories {
		mavenCentral()
	}
	dependencies {
		classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
		classpath('org.postgresql:postgresql:42.1.4.jre7')
		//classpath 'org.asciidoctor:asciidoctor-gradle-plugin:1.5.9.2'
	}
}

plugins {
	id "org.sonarqube" version "2.7"
}

apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'org.springframework.boot'
apply plugin: 'war'
apply plugin: 'io.spring.dependency-management'
apply plugin: 'jacoco'
//apply plugin: 'org.asciidoctor.convert'

group = 'com.upc.gessi.qrapids'
version = '3.3'
sourceCompatibility = 1.8


war {
	from 'README.md'
	baseName = 'learning-dashboard'
	version =  version
	webXml = file('src/main/resources/web.xml')
	from ('src/main/resources') {
		include 'Logs-servlet.xml'
		into 'WEB-INF'
	}
	enabled = true
}
bootWar {
	from 'README.md'
	baseName = 'learning-dashboard'
	version =  version
	webXml = file('src/main/resources/web.xml')
	from ('src/main/resources') {
		include 'Logs-servlet.xml'
		into 'WEB-INF'
	}
	enabled = true
}

/*
bootJar {
	baseName = 'learning-dashboard'
    version = version
    enabled = true
}
*/
repositories {
	mavenCentral()
}

dependencies {

	// Security
	implementation("org.springframework.boot:spring-boot-starter-security")

	// JWT
	implementation("io.jsonwebtoken:jjwt:0.7.0")

	// Development
	implementation('org.springframework.boot:spring-boot-devtools')

	// Spring Boot
	implementation('org.springframework.boot:spring-boot-starter-actuator')
	implementation('org.springframework.boot:spring-boot-starter-data-jpa')
	implementation('org.springframework.boot:spring-boot-starter-thymeleaf')
	implementation('org.springframework.boot:spring-boot-starter-web')

	// Spring mail
	implementation 'org.springframework.boot:spring-boot-starter-mail:1.5.8.RELEASE'

	// Database JDBC
	implementation('org.postgresql:postgresql:42.1.4.jre7')

	// JSON Java Library
	implementation 'com.google.code.gson:gson:2.8.2'

	// Socket
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	// Utils
	implementation 'commons-io:commons-io:2.5'
	implementation 'commons-codec:commons-codec:1.10'

	// MongoDB API
	implementation('org.mongodb:mongodb-driver-sync:3.12.14')
	implementation('org.mongodb:mongodb-driver-core:3.12.14')
	implementation('org.mongodb:bson:3.12.14')
	implementation files('libs/LD-qma-mongo-1.0.jar')

	// QR-Eval library
	implementation files('libs/LD-eval-2.2.jar')

	// Logging
	implementation('org.apache.logging.log4j:log4j-api:2.9.1')
	implementation('org.apache.logging.log4j:log4j-core:2.9.1')

	// Rest API Documentation
	//asciidoctor 'org.springframework.restdocs:spring-restdocs-asciidoctor'

	// Testing
	testImplementation('org.springframework.boot:spring-boot-starter-test')
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
	testImplementation('com.h2database:h2')
	// Comment this line to launch application from developing environment
	// Uncomment this line before generating .war file
	runtimeOnly 'org.springframework.boot:spring-boot-starter-tomcat'

}

jacoco {
	toolVersion = "0.8.8"
}

jacocoTestReport {
	reports {
		xml.enabled = true
		html.enabled = false
	}
}
